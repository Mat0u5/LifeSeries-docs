name: Deploy VitePress site to Pages

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (all branches)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build main branch
        working-directory: ./repo
        run: |
          npm ci
          npm run docs:build
          mkdir -p ../combined
          cp -r docs/.vitepress/dist/. ../combined/

      - name: Build other branches
        working-directory: ./repo
        run: |
          set -uo pipefail
          failed=()

          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            branch="$ref"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "main" ] && continue

            slug=$(echo "$branch" | sed 's|[^A-Za-z0-9._-]|-|g')

            if [ -e "../combined/$slug" ]; then
              echo "::warning::Skipping branch '$branch': /$slug/ already exists in the main site"
              continue
            fi

            echo "::group::Building branch '$branch' -> /$slug/"
            dir="../branches/$slug"
            git worktree add --detach "$dir" "origin/$branch"

            if (
              set -e
              cd "$dir"
              if [ ! -f docs/.vitepress/config.mts ]; then
                echo "No docs/.vitepress/config.mts on this branch"
                exit 1
              fi
              sed -i "s|base: '/LifeSeries-docs/'|base: '/LifeSeries-docs/$slug/'|" docs/.vitepress/config.mts
              npm ci
              npm run docs:build
              mkdir -p "$GITHUB_WORKSPACE/combined/$slug"
              cp -r docs/.vitepress/dist/. "$GITHUB_WORKSPACE/combined/$slug/"
            ); then
              echo "Built '$branch'"
            else
              echo "::warning::Build failed for branch '$branch', it will not be deployed"
              failed+=("$branch")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Branches that failed to build: ${failed[*]}"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4